<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body class="kbbi-popup-body">
  <div class="kbbi-ext-wrap">
    <div style="font-weight: 800; color: #2d3748; margin-bottom: 15px; font-size: 20px; letter-spacing: -0.5px;">Klik KBBI</div>
    
    <div class="kbbi-search-container">
      <input type="text" id="input-kata" class="kbbi-input" placeholder="Cari kata..." autofocus>
      <button id="btn-cari" class="kbbi-btn">Cari</button>
    </div>

    <div id="result-container" class="kbbi-ext-wrap">
      <div style="text-align: center; padding: 20px; color: #a0aec0; font-size: 14px;">
        Masukkan kata dasar untuk hasil terbaik.
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
